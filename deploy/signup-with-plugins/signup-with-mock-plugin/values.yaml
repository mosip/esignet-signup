## Uncomment required parms added with single '#' when needed.
#image:
#  registry: docker.io
#  repository: mosipdev/signup-service
#  tag: develop

extraEnvVars:
  MOSIP_ESIGNET_HOST:
    valueFrom:
      configMapKeyRef:
        name: esignet-global
        key: mosip-esignet-host
  MOSIP_SIGNUP_HOST:
    valueFrom:
      configMapKeyRef:
        name: esignet-global
        key: mosip-signup-host
  KEYCLOAK_EXTERNAL_URL:
    valueFrom:
      configMapKeyRef:
        name: keycloak-host
        key: keycloak-external-url
  MOSIP_SIGNUP_CAPTCHA_SITE_KEY:
    valueFrom:
      secretKeyRef:
        name: signup-captcha
        key: signup-captcha-site-key
  MOSIP_SIGNUP_OIDC_KEYSTORE_PWD:
    valueFrom:
      secretKeyRef:
        name: signup-keystore-password
        key: signup-keystore-password
  REDIS_HOST:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-host
  REDIS_PORT:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-port
  REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: redis
        key: redis-password
  MOSIP_SIGNUP_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: keycloak-client-secrets
        key: mosip_signup_client_secret
  MOSIP_SIGNUP_MOCK_MANDATORY_ATTRIBUTES_CREATE: fullName,phone,password,preferredLang
  MOSIP_SIGNUP_MOCK_USERNAME_FIELD: phone
  MOSIP_SIGNUP_SUPPORTED_LANGUAGES: '{''eng'',''khm''}'
  MOSIP_SIGNUP_FULLNAME_PATTERN: ^[\u1780-\u17FF\u19E0-\u19FF\u1A00-\u1A9F\u0020]{1,30}$
  MOSIP_SIGNUP_UI_CONFIG_KEY_VALUES_FULLNAME_ALLOWED_CHARACTERS: ^[\u1780-\u17FF\u19E0-\u19FF\u1A00-\u1A9F\u0020]
  MOSIP_MOCK_IDA_IDENTITY_SCHEMA_URL: https://raw.githubusercontent.com/mosip/esignet-mock-services/refs/heads/develop/mock-identity-system/src/main/resources/mock-identity-signup-schema.json
  NAMESPACE: mock

## ConfigMap with extra environment variables that used
##
#extraEnvVarsCM: []

## Secret with extra environment variables
##
#extraEnvVarsSecret: []
