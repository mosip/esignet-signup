WebSocketConnection:
   Signup_ESignet_WebSocketConnection_uin_all_Valid_Smoke:
      endPoint: /v1/signup/ws
      uniqueIdentifier: TC_Signup_ESignet_WebSocketConnection_01
      description: Creating websocket connection and sending message to it
      role: resident
      checkErrorsOnlyInResponse: true
      inputTemplate: signup/WebSocketConnection/WebSocketConnection
      outputTemplate: signup/WebSocketConnection/WebSocketConnectionResult
      input: '{
        "slotId": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_Smoke_Sid_slotId$",
        "idvSlotAllotted": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_Smoke_Sid_idvSlotAllotted$",
        "sendDestination": "/v1/signup/ws/process-frame",
        "message1": {
          "stepCode": "START",
          "frames": [
            { "frame": "frame1", "order": "0" }
          ]
        },
        "message2": {
          "stepCode": "liveness_check",
          "frames": [
            { "frame": "frame1", "order": "1" }
          ]
        }
}'
      output: '{
}'
   Signup_ESignet_WebSocketConnection_uin_Incomplete:
      endPoint: /v1/signup/ws
      uniqueIdentifier: TC_Signup_ESignet_WebSocketConnection_02
      description: WebSocket client sends one frame then disconnects abruptly without a close handshake - expected, no exception on the client and the suite continues unaffected
      role: resident
      checkErrorsOnlyInResponse: true
      inputTemplate: signup/WebSocketConnection/WebSocketConnection
      outputTemplate: signup/WebSocketConnection/WebSocketConnectionResult
      input: '{
        "slotId": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_disabilityTypeVISION_Smoke_Sid_slotId$",
        "idvSlotAllotted": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_disabilityTypeVISION_Smoke_Sid_idvSlotAllotted$",
        "sendDestination": "/v1/signup/ws/process-frame",
        "message1": {
          "stepCode": "START",
          "frames": [
            { "frame": "frame1", "order": "0" }
          ]
        },
        "message2": {
          "stepCode": "liveness_check",
          "frames": [
            { "frame": "frame1", "order": "1" }
          ]
        }
}'
      output: '{
}'
   Signup_ESignet_WebSocketConnection_uin_LargeFrame_Smoke:
      endPoint: /v1/signup/ws
      uniqueIdentifier: TC_Signup_ESignet_WebSocketConnection_03
      description: Establish a valid WebSocket connection then send a process-frame message with a valid stepCode and a large multi-word frame value
      role: resident
      inputTemplate: signup/WebSocketConnection/WebSocketConnection
      outputTemplate: signup/WebSocketConnection/WebSocketConnectionResult
      input: '{
        "slotId": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_differentIdentifier_Smoke_Sid_slotId$",
        "idvSlotAllotted": "$ID:ESignet_GetSlot_STransId_AuthToken_Xsrf_uin_all_Valid_differentIdentifier_Smoke_Sid_idvSlotAllotted$",
        "sendDestination": "/v1/signup/ws/process-frame",
        "message1": {
          "stepCode": "START",
          "frames": [
            { "frame": "the quick brown fox jumps over the lazy sleeping dog", "order": "0" }
          ]
        },
        "message2": {
          "stepCode": "liveness_check",
          "frames": [
            { "frame": "frame1", "order": "1" }
          ]
        }
}'
      output: '{
        "expectedFeedbackCodes": []
}'
