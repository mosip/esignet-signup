      additionalDependencies: TC_ESignet_UploadFileNegTC_Shared_VerifyChallenge
      inputTemplate: signup/UploadFile/UploadFile
      input: '{
    "verifiedTransactionID": "$ID:ESignet_VerifyChallenge_STransId_UploadFileNegShared_Pos_VTransactionID$",
    "omitField": true,
    "filePath": ["$UPLOADFILEPATH$"],
    "fileKeyName": "file"
}'
