   Signup_ESignet_UploadFile_NegTC_ExpiredOrInvalidTransaction:
      endPoint: /v1/signup/registration/upload-file
      uniqueIdentifier: TC_ESignet_UploadFileNegTC_09
      description: Verify behavior when the verifiedTransactionID cookie is expired/invalid. NOTE - confirmed against the live env that this returns HTTP 200 with an invalid_transaction business error, not HTTP 401; the multipart upload-file call never sends an Authorization/session header, only this transaction cookie, so it cannot reproduce a true 401 session-expiry case.
      role: resident
      restMethod: post
      inputTemplate: signup/UploadFile/UploadFile
      outputTemplate: signup/error
      input: '{
    "verifiedTransactionID": "expired-or-invalid-transaction-id-00000000",
    "field": "$UPLOADFILEFIELDID$",
    "filePath": "$UPLOADFILEPATH$",
    "fileKeyName": "file"
}'
      output: '{
  "errors": [
    {
      "errorCode": "invalid_transaction"
    }
  ]
}'

