      role: resident
      restMethod: post
      additionalDependencies: TC_ESignet_VerifyChallenge_01
      inputTemplate: signup/UploadFile/UploadFileMissingField
      input: '{
    "verifiedTransactionID": "$ID:ESignet_VerifyChallenge_STransId_smoke_Pos_VTransactionID$",
    "filePath": "$UPLOADFILEPATH$",
    "fileKeyName": "file"
}'
      output: '400'

   Signup_ESignet_GenerateChallenge_STransId_UploadFileNeg02_Pos:
      endPoint: /v1/signup/registration/generate-challenge
      uniqueIdentifier: TC_ESignet_UploadFileNegTC_02_GenerateChallenge
      description: Mint a fresh transaction dedicated to the InvalidField negative test, since transactions are single-use for upload-file
      role: resident
      restMethod: post
      inputTemplate: signup/GenerateChallenge/GenerateChallenge
      outputTemplate: signup/GenerateChallenge/GenerateChallengeResult
      input: '{
   "identifier": "$PHONENUMBERFROMREGEXFORSIGNUP$",
   "captchaToken": "",
   "purpose": "REGISTRATION",
   "requestTime": "$TIMESTAMP$"
}'
      output: '{
  "status":"SUCCESS"
}'

   Signup_ESignet_VerifyChallenge_STransId_UploadFileNeg02_Pos:
      endPoint: /v1/signup/registration/verify-challenge
      uniqueIdentifier: TC_ESignet_UploadFileNegTC_02_VerifyChallenge
      description: Verify the challenge for the transaction minted for the InvalidField negative test, producing a fresh verifiedTransactionID
      role: resident
      restMethod: post
      additionalDependencies: TC_ESignet_UploadFileNegTC_02_GenerateChallenge
      inputTemplate: signup/VerifyChallenge/VerifyChallenge
      outputTemplate: signup/VerifyChallenge/VerifyChallengeResult
      input: '{
         "headerTransactionID": "$ID:ESignet_GenerateChallenge_STransId_UploadFileNeg02_Pos_TransactionID$",
         "identifier": "$ID:ESignet_GenerateChallenge_STransId_UploadFileNeg02_Pos_PHONE$",
         "challenge": "$ID:ESignet_GenerateChallenge_STransId_UploadFileNeg02_Pos_PHONE$@phone",
         "format": "alpha-numeric",
         "type": "OTP",
         "requestTime": "$TIMESTAMP$"
}'
      output: '{
  "status":"SUCCESS"
}'

